# Project-owned: not from AllesSandro, so template updates never touch it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Verifies the wrapper jar's checksum and caches Gradle's downloads.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # tools/tv.py: the device-free half of the TV and emulator tool.
      - run: python3 -m unittest discover -s tools

      # The health command: formatting, Android Lint and unit tests (Robolectric included).
      - run: ./gradlew check
      # The release build is the one with R8 shrinking, which check does not run. The benchmark
      # module only runs on a device, so CI checks that it and its target variants build.
      - run: ./gradlew assembleRelease :benchmark:assemble
